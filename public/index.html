<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f6f0">
	<title>Quiz Average</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #182923;
			--muted: #65736d;
			--paper: #f4f6f0;
			--surface: #fff;
			--line: #dce4dc;
			--green: #176b4b;
			--green-dark: #10543a;
			--coral: #e8765c;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background:
				radial-gradient(ellipse at 8% 10%, rgb(216 235 219 / 72%), transparent 32rem),
				linear-gradient(135deg, var(--paper), #f8f5ee 70%);
			font-family: "Segoe UI", sans-serif;
		}

		main {
			width: min(100% - 40px, 720px);
			margin: 0 auto;
			padding: 64px 0 48px;
			animation: arrive 450ms ease-out both;
		}

		.eyebrow {
			display: flex;
			align-items: center;
			gap: 10px;
			color: var(--green);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 1.5px;
			text-transform: uppercase;
		}

		.eyebrow::before {
			width: 22px;
			height: 2px;
			background: var(--coral);
			content: "";
		}

		h1 {
			margin: 14px 0 10px;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(38px, 7vw, 58px);
			font-weight: 500;
			line-height: 1.04;
		}

		.intro {
			margin: 0;
			color: var(--muted);
			font-size: 16px;
			line-height: 1.6;
		}

		form { margin-top: 34px; }

		.quiz-list {
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--surface);
			box-shadow: 0 16px 38px rgb(24 41 35 / 7%);
		}

		.quiz-row {
			display: grid;
			grid-template-columns: 54px 1fr 130px;
			align-items: center;
			gap: 16px;
			min-height: 86px;
			padding: 16px 22px;
			border-bottom: 1px solid var(--line);
		}

		.quiz-row:last-child { border-bottom: 0; }

		.quiz-number {
			color: var(--coral);
			font-family: Georgia, "Times New Roman", serif;
			font-size: 21px;
		}

		.quiz-label { font-size: 16px; font-weight: 650; }

		.score-wrap {
			display: flex;
			align-items: center;
			gap: 9px;
			color: var(--muted);
			font-size: 13px;
		}

		input {
			width: 82px;
			height: 44px;
			padding: 0 10px;
			border: 1px solid #cbd7ce;
			border-radius: 5px;
			outline: none;
			color: var(--ink);
			background: #fbfcfa;
			font: inherit;
			font-size: 16px;
			text-align: center;
			transition: border-color 140ms ease, box-shadow 140ms ease;
		}

		input:focus {
			border-color: var(--green);
			box-shadow: 0 0 0 3px rgb(23 107 75 / 13%);
		}

		.actions {
			display: flex;
			align-items: center;
			gap: 18px;
			margin-top: 22px;
		}

		button {
			min-height: 48px;
			padding: 0 22px;
			border: 0;
			border-radius: 5px;
			color: white;
			background: var(--green);
			cursor: pointer;
			font: inherit;
			font-size: 15px;
			font-weight: 700;
			transition: background 140ms ease, transform 140ms ease;
		}

		button:hover { background: var(--green-dark); }
		button:active { transform: translateY(1px); }
		button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

		.hint, .message {
			margin: 0;
			color: var(--muted);
			font-size: 13px;
			line-height: 1.5;
		}

		.result {
			display: none;
			align-items: end;
			justify-content: space-between;
			gap: 16px;
			margin-top: 22px;
			padding: 22px 24px;
			border-left: 4px solid var(--coral);
			border-radius: 0 6px 6px 0;
			background: #e7efe7;
			animation: arrive 220ms ease-out both;
		}

		.result.visible { display: flex; }
		.result-label { color: var(--muted); font-size: 13px; font-weight: 650; }
		.result-value { margin-top: 3px; font-family: Georgia, "Times New Roman", serif; font-size: 38px; line-height: 1; }
		.result-total { color: var(--muted); font-size: 13px; }
		.message { min-height: 20px; margin-top: 12px; color: #a33d2a; }

		@keyframes arrive {
			from { opacity: 0; transform: translateY(8px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 520px) {
			main { width: min(100% - 32px, 720px); padding-top: 42px; }
			.quiz-row { grid-template-columns: 36px 1fr auto; gap: 10px; padding: 14px; }
			.quiz-label { font-size: 14px; }
			.score-wrap { gap: 5px; font-size: 12px; }
			input { width: 68px; }
			.actions { align-items: flex-start; flex-direction: column; gap: 10px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>

		<div class="eyebrow">Score tracker</div>
		<h1>Quiz average</h1>
		<p class="intro">Enter your score for each quiz to see your overall average.</p>

	
			<div class="quiz-list">
				<label class="quiz-row" for="quiz-1">
					<span class="quiz-label">Quiz 1</span>
					<span class="score-wrap"><input id="quiz-1" name="quiz1" type="number" min="0" max="100" step="any" required inputmode="decimal" aria-label="Quiz 1 score"><span>/ 100</span></span>
				</label>
				<label class="quiz-row" for="quiz-2">
					<span class="quiz-label">Quiz 2</span>
					<span class="score-wrap"><input id="quiz-2" name="quiz2" type="number" min="0" max="100" step="any" required inputmode="decimal" aria-label="Quiz 2 score"><span>/ 100</span></span>
				</label>
				<label class="quiz-row" for="quiz-3">
					<span class="quiz-label">Quiz 3</span>
					<span class="score-wrap"><input id="quiz-3" name="quiz3" type="number" min="0" max="100" step="any" required inputmode="decimal" aria-label="Quiz 3 score"><span>/ 100</span></span>
				</label>
			</div>

			<div class="actions">
				<button type="button" id="btnsubmit">Compute average</button>
				<p class="hint">Scores must be between 0 and 100.</p>
			</div>
			<p class="message" id="message" role="alert" aria-live="polite"></p>

					<div class="result-label">Your average</div>
					<div class="result-value" id="average">0%</div>
				</div>
				<div class="result-total" id="total"></div>
	
	

	<script>
		const buttonsubmit = document.querySelector('#btnsubmit');
		const q1 = document.querySelector('#quiz-1');
        const q2 = document.querySelector('#quiz-2');
        const q3 = document.querySelector('#quiz-3');
		const result = document.querySelector('#average');

		buttonsubmit.addEventListener('click', (event) => {
			event.preventDefault();
			const total = Number(q1.value) + Number(q2.value) + Number(q3.value);
			const average = total / 3;
			result.textContent = average.toFixed(2) + "%";
		});
	</script>
</body>
</html>
