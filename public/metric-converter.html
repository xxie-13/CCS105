<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f0">
  <title>Metric Converter</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182923;
      --muted: #65736d;
      --paper: #f4f6f0;
      --line: #d4ddd5;
      --green: #176b4b;
      --green-dark: #10543a;
      --coral: #e8765c;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 10%, rgb(216 235 219 / 72%), transparent 32rem),
        linear-gradient(135deg, var(--paper), #f8f5ee 70%);
      font-family: "Segoe UI", sans-serif;
    }

    main {
      width: min(100% - 48px, 1120px);
      margin: 0 auto;
      padding: 64px 0 56px;
      animation: arrive 420ms ease-out both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 22px;
      height: 2px;
      background: var(--coral);
      content: "";
    }

    h1 {
      margin: 14px 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 6vw, 68px);
      font-weight: 500;
      line-height: 1.05;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .converter-controls {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto auto;
      align-items: end;
      gap: 10px;
      margin-top: 42px;
      padding: 22px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #bbc9bd;
      border-radius: 5px;
      outline: none;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 18px;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgb(23 107 75 / 13%);
    }

    button {
      min-height: 50px;
      padding: 0 16px;
      border: 1px solid var(--green);
      border-radius: 5px;
      color: var(--green-dark);
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
      transition: color 140ms ease, background 140ms ease, transform 140ms ease;
    }

    button:hover,
    button[aria-pressed="true"] {
      color: #fff;
      background: var(--green);
    }

    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

    .result {
      min-height: 120px;
      padding-top: 28px;
    }

    .result-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    #output {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 4vw, 40px);
      font-weight: 600;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    #message {
      min-height: 20px;
      margin: 10px 0 0;
      color: #a33d2a;
      font-size: 13px;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 780px) {
      main { width: min(100% - 32px, 620px); padding-top: 44px; }
      .converter-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .input-group { grid-column: 1 / -1; }
      button { white-space: normal; }
    }

    @media (max-width: 420px) {
      .converter-controls { grid-template-columns: 1fr; }
      .input-group { grid-column: auto; }
      button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Quick calculations</div>
    <h1>Metric Converter</h1>
    <p class="intro">Enter a value, then choose what you want to convert.</p>

    <section class="converter-controls" aria-label="Conversion options">
      <div class="input-group">
        <label for="quantity">Value</label>
        <input id="quantity" type="number" step="any" value="34" inputmode="decimal">
      </div>
      <button type="button" id="meters" aria-pressed="true">Meters to Feet</button>
      <button type="button" id="kilograms" aria-pressed="false">Kilograms to Pounds</button>
      <button type="button" id="celsius" aria-pressed="false">Celsius to Fahrenheit</button>
    </section>

    <section class="result" aria-live="polite" aria-atomic="true">
      <p class="result-label">Result</p>
      <p id="output">34 meters = 111.55 feet</p>
      <p id="message" role="alert"></p>
    </section>
  </main>

  <script>
    const quantityInput = document.querySelector('#quantity');
    const output = document.querySelector('#output');
    const message = document.querySelector('#message');
    const metersButton = document.querySelector("#meters");
    const kilogramsButton = document.querySelector('#kilograms');
    const celsiusButton = document.querySelector('#celsius');

    metersButton.addEventListener('click', () => {
      const amount = Number(quantityInput.value);
      message.textContent = '';
      output.textContent = `${amount} meters = ${(amount * 3.28084).toFixed(2)} feet`;
    });

    kilogramsButton.addEventListener('click', () => {
      const amount = Number(quantityInput.value);
       message.textContent = '';
      output.textContent = `${amount} kilograms = ${(amount * 2.20462).toFixed(2)} pounds`;
    
    });

    celsiusButton.addEventListener('click', () => {
      const amount = Number(quantityInput.value);
      message.textContent = '';
      output.textContent = `${amount} Celsius = ${((amount * 9 / 5) + 32).toFixed(2)} Fahrenheit`;
        });
  </script>
</body>
</html>
